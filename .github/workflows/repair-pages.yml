name: Repair Pages

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel the stale Pages deployment
        run: gh api --method POST "repos/$GH_REPO/pages/deployments/289bfd4a422583518497c7c51a98dad9ff62ad96/cancel"
      - name: Request a fresh Pages build
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
